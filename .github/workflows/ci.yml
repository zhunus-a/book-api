name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install flask requests pytest

      - name: Start Flask and run tests
        run: |
          python -m flask --app app run --host 127.0.0.1 --port 5001 > flask.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5001/healthz; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Flask server exited"
              cat flask.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:5001/healthz; then
            echo "Flask server is not ready"
            cat flask.log
            exit 1
          fi

          python -m pytest -v

      - name: Show server logs if failed
        if: failure()
        run: cat flask.log || true
