name: CI

on:
  push:
    branches: [main] 
  pull_request:

permissions:
  contents: read                  # 2. tests only need to READ the code

defaults:
  run:
    shell: bash      

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests                    # 3. the name you want to see in the Actions tab
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@7
        with:
          python-version: «3.12»

      - run: ./scripts/test.sh
      - cache: pip
