
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests
        run: ./scripts/test.sh
        
  publish:
    name: Build, scan and publish the image
    needs: test                    
    if: github.event_name == 'push'   
    runs-on: ubuntu-24.04
    permissions:
      contents: read           
      packages: write              
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Name the image in lowercase - registries require it
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image - it stays on the runner for now
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - run it on port 9123 and call /healthz
        run: |
          docker run -d --name app -e PORT=9123 -p 9123:9123 "$IMAGE:$GITHUB_SHA"   
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:9123/healthz

      - name: Show the container's output if anything failed
        if: failure()
        run: docker logs app || true

      - name: Scan - fail on critical vulnerabilities that have a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
            scan-type: image
            image-ref: ${{ env.IMAGE }}:${{ github.sha }}
            cache-dir: ${{ runner.temp }}/trivy
            severity: CRITICAL
            ignore-unfixed: true
            exit-code: "1"     

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     
      - name: Work out the tags
        id: meta 
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
	with:
	  images: ${{ env.IMAGE }}
	  tags: |
	    type=sha, format=long,prefix=
	    type=semver,pattern={{version}}
	    type=raw,value=latest,enable={{is_default_branch}}
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Push - tagged with the commit SHA, and latest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # 7. in the first tag below: the commit being built - the tag M3 looks for
          tags: ${{ steps.meta.outputs.tags }}
	  labels: ${{ steps.meta.outputs.labels }}
  
