apiVersion: apps/v1
kind: Deployment
metadata:
  name: mine
  labels:
    app: mine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mine
  template:
    metadata:
      labels:
        app: mine
    spec:
      containers:
        - name: app
          image: ghcr.io/zhunus-a/book-api:f480379d5b106b9b729b836baf41a4785313bd5e
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mine
  labels:
    app: mine
spec:
  type: ClusterIP
  selector:
    app: mine
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
